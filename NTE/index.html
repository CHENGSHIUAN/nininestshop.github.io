<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💖婗⭐異環⭐組合查詢</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        :root {
            --primary-pink: #ff85b2;
            --soft-pink: #fff0f6;
            --bg-gray: #fdfbfb;
            --text-dark: #4a4a4a;
        }

        body { 
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; 
            background-color: var(--bg-gray); 
            margin: 0; padding: 20px; color: var(--text-dark); 
        }

        .game-header { 
            text-align: center; 
            background: linear-gradient(135deg, #333, #555); 
            color: white; 
            padding: 25px; 
            border-radius: 15px; 
            margin-bottom: 20px; 
        }

        .game-header h1 { 
            margin: 0; 
            font-size: 26px; 
        }

        .filter-section { 
            background: white; 
            padding: 20px; 
            border-radius: 15px; 
            margin-bottom: 25px; 
        }

        .search-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); 
            gap: 12px; 
            margin-bottom: 20px; 
        }

        .search-item { 
            border: 2px solid #f0f0f0; 
            padding: 8px; 
            border-radius: 12px; 
            text-align: center; 
            background: #fff; 
        }

        .search-item img { 
            width: 60px; 
            height: 60px; 
            object-fit: cover; 
            border-radius: 10px; 
            margin-bottom: 6px; 
        }

        /* ⭐ 修正：名稱最多顯示兩行 */
        .search-item .name { 
            font-size: 13px; 
            font-weight: 600; 
            color: #666; 
            display: block; 
            line-height: 1.2em;
            max-height: 2.4em;
            overflow: hidden;
        }

        .counter { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 5px; 
            margin-top: 5px; 
        }

        .counter button { 
            width: 22px; 
            height: 22px; 
            cursor: pointer; 
        }

        .counter input { 
            width: 25px; 
            text-align: center; 
        }

        .search-btn { 
            background: linear-gradient(to right, #ff85b2, #f76ca1); 
            color: white; 
            border: none; 
            padding: 12px 40px; 
            border-radius: 50px; 
            cursor: pointer; 
            font-size: 16px; 
            display: block; 
            margin: 0 auto;
        }

        .package-list { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }

        .package-card {
            background: white; 
            border-radius: 15px; 
            display: flex; 
            align-items: center;
            padding: 15px;
        }

        .id-area { 
            width: 150px; 
        }

        .id-text { 
            font-size: 14px; 
            font-weight: bold; 
            color: #e83e8c; 
        }

        .content-area { 
            flex: 1; 
            display: flex; 
            flex-wrap: wrap; 
            gap: 10px; 
        }

        .card-box { 
            width: 75px; 
            text-align: center; 
        }

        .card-box img { 
            width: 100%; 
            height: 75px; 
            object-fit: cover; 
            border-radius: 10px; 
        }

        /* ⭐ 修正：卡片名稱最多兩行 */
        .card-label { 
            font-size: 11px; 
            color: #888; 
            margin-top: 4px; 
            display: block;
            line-height: 1.2em;
            max-height: 2.4em;
            overflow: hidden;
        }

        .loading { 
            text-align: center; 
            padding: 40px; 
            color: var(--primary-pink); 
        }

        @media (max-width: 600px) {
            .search-grid {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            }

            .search-item img {
                width: 50px;
                height: 50px;
            }

            .card-box {
                width: 65px;
            }

            .card-box img {
                height: 65px;
            }
        }
    </style>
</head>
<body>

<div id="app">
    <header class="game-header">
        <h1>💖婗⭐異環⭐台港澳</h1>
    </header>

    <div class="filter-section">
        <div class="search-grid">
            <div v-for="name in allAvailableCards" :key="name" class="search-item">
                <img :src="'images/' + name + '.png'" onerror="this.src='https://via.placeholder.com/65?text=?'">
                <span class="name">{{ name }}</span>
                <div class="counter">
                    <button @click="changeCount(name, -1)">-</button>
                    <input type="text" :value="searchCounts[name] || 0" readonly>
                    <button @click="changeCount(name, 1)">+</button>
                </div>
            </div>
        </div>
        <button class="search-btn" @click="doSearch">查詢組合 (๑・ω-)～♥”</button>
    </div>

    <div v-if="loading" class="loading">正在載入資料...</div>
    
    <div v-else class="package-list">
        <div class="package-card" v-for="item in searchResults" :key="item.id">
            <div class="id-area">
                <div class="id-text">{{ item.id }}</div>
            </div>
            <div class="content-area">
                <div class="card-box" v-for="(count, cardName) in item.cards" :key="cardName">
                    <img :src="'images/' + cardName + '.png'">
                    <span v-if="count > 1">{{ count }}</span>
                    <span class="card-label">{{ cardName }}</span>
                </div>
            </div>
        </div>

        <div v-if="searchResults.length === 0" style="text-align: center; padding: 40px;">
            沒有找到符合條件
        </div>
    </div>
</div>

<script>
const { createApp } = Vue;

const SPREADSHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTuPYiBGLF8aNRN885qbEu3nOQ_WA0wCMxoQLRWDhBYDbe-5P39A4vMTcW9LR1vq8TeoBQWO3tCeZdV/pub?output=csv';

createApp({
    data() {
        return {
            allAvailableCards: ['娜娜莉','早霧','白藏','哈索爾','九原','法帝婭','達芙蒂爾','娜娜莉專武','現實避難所','焰魂狂飆','漆黑青春妄想','茶花會','好狗狗走四方','娜娜莉時裝','萌虎來襲塗裝','男主','女主','自選未用','S常駐角色自選箱'],
            searchCounts: {},
            allPackages: [],
            searchResults: [],
            loading: true
        }
    },
    methods: {
        changeCount(name, delta) {
            if (!this.searchCounts[name]) this.searchCounts[name] = 0;
            let newValue = this.searchCounts[name] + delta;
            this.searchCounts[name] = newValue < 0 ? 0 : newValue;
        },
        doSearch() {
            this.searchResults = this.allPackages.filter(pkg => {
                for (let name in this.searchCounts) {
                    let required = this.searchCounts[name];
                    if (required > 0) {
                        let pkgCount = pkg.cards[name] || 0;
                        if (pkgCount < required) return false;
                    }
                }
                return true;
            });
        },
        fetchData() {
            Papa.parse(SPREADSHEET_URL, {
                download: true,
                header: true,
                complete: (results) => {
                    this.allPackages = results.data
                        .filter(row => row.id)
                        .map(row => {
                            let cardData = {};
                            if (row.content) {
                                row.content.split('+').forEach(part => {
                                    let [name, count] = part.split('x');
                                    if (name) cardData[name.trim()] = parseInt(count) || 1;
                                });
                            }
                            return { id: row.id, cards: cardData };
                        });
                    this.searchResults = this.allPackages;
                    this.loading = false;
                }
            });
        }
    },
    mounted() {
        this.allAvailableCards.forEach(n => this.searchCounts[n] = 0);
        this.fetchData();
    }
}).mount('#app');
</script>

</body>
</html>
